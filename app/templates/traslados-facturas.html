{% extends "layout.html" %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <h1 style="color: var(--primary); font-size: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
        Facturas Pendientes
    </h1>
    <div style="font-size: 0.9rem; color: var(--text-muted); font-style: italic; margin-top: 0.5rem;"
        id="ultimaActualizacion">
        Última actualización: cargando...
    </div>
</div>

<div class="card" style="padding: 1.5rem;">
    <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <div style="display:flex; align-items:center; gap: 1rem;">
            <label style="font-weight: 500; font-size: 0.9rem;">Antigüedad mayor a:</label>
            <select id="invoiceDays" onchange="reloadInvoices()"
                style="padding: 0.4rem; border-radius: 4px; border: 1px solid var(--border);">
                <option value="15">15 Días</option>
                <option value="30">30 Días</option>
                <option value="45">45 Días</option>
                <option value="60">60 Días</option>
            </select>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <button onclick="toggleAutoUpdate()" id="btnToggle" class="btn"
                style="padding: 0.4rem 0.8rem; font-size: 0.85rem; background: var(--danger); border-color: var(--danger);">
                ⏹ Detener
            </button>
        </div>
    </div>

    <table id="tablaFacturas" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Número</th>
                <th>Fecha</th>
                <th>Cliente</th>
                <th>Monto</th>
                <th>Días Venc.</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script>
    let tablaFacturas = null;
    let intervalInvoices = null;
    const REFRESH_RATE = 30000;

    $(document).ready(function () {
        tablaFacturas = $('#tablaFacturas').DataTable({
            "data": [],
            "columns": [
                { "data": "Numero", defaultContent: "-" },
                { "data": "Fecha", defaultContent: "-" },
                { "data": "Cliente", defaultContent: "-" },
                { "data": "Monto", defaultContent: "0.00", render: $.fn.dataTable.render.number(',', '.', 2, '$') },
                { "data": "DiasVencidos", defaultContent: "0" }
            ],
            "language": { "url": "//cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json" },
            "pageLength": 25,
            "dom": "tp",
            "order": [[4, "desc"]] // Sort by days overdue descending
        });

        // Start auto-update
        toggleAutoUpdate(true);
    });

    function loadInvoices() {
        const days = $('#invoiceDays').val();
        $.ajax({
            url: '/api/traslados/facturas-pendientes?days=' + days,
            success: function (data) {
                tablaFacturas.clear().rows.add(data).draw();
                $('#ultimaActualizacion').text('Última actualización: ' + new Date().toLocaleTimeString());
            },
            error: function () {
                console.error("Error loading invoices");
            }
        });
    }

    function reloadInvoices() {
        loadInvoices();
        toggleAutoUpdate(true); // Reset timer
    }

    function toggleAutoUpdate(forceStart = false) {
        if (intervalInvoices && !forceStart) {
            clearInterval(intervalInvoices);
            intervalInvoices = null;
            $('#btnToggle').html('▶ Reanudar').css('background', 'var(--success)').css('border-color', 'var(--success)');
        } else {
            if (intervalInvoices) clearInterval(intervalInvoices);
            loadInvoices(); // Initial load
            intervalInvoices = setInterval(loadInvoices, REFRESH_RATE);
            $('#btnToggle').html('⏹ Detener').css('background', 'var(--danger)').css('border-color', 'var(--danger)');
        }
    }
</script>
{% endblock %}
