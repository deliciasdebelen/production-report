{% extends "layout.html" %}

{% block content %}
<div style="height: calc(100vh - 120px); overflow: hidden;">
    <div style="display: flex; gap: 1rem; height: 100%;">

        <!-- Tablero 1: Pendientes -->
        <div class="visor-col">
            <div class="visor-header bg-warning">
                <h3>🕒 Planificación Pendiente</h3>
                <span class="badge" id="count-pending">0</span>
            </div>
            <div class="visor-body" id="list-pending">
                <!-- Items injected via JS -->
            </div>
        </div>

        <!-- Tablero 2: Procesadas -->
        <div class="visor-col">
            <div class="visor-header bg-success">
                <h3>✅ Producción Procesada</h3>
                <span class="badge" id="count-processed">0</span>
            </div>
            <div class="visor-body" id="list-processed">
                <!-- Items injected via JS -->
            </div>
        </div>

        <!-- Tablero 3: Backlog -->
        <div class="visor-col">
            <div class="visor-header bg-danger">
                <h3>🚨 Indice (Backlog)</h3>
                <span class="badge" id="count-backlog">0</span>
            </div>
            <div class="visor-body" id="list-backlog">
                <!-- Items injected via JS -->
            </div>
        </div>

    </div>
</div>

<style>
    .visor-col {
        flex: 1;
        background: #1e293b;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .visor-header {
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .visor-header h3 {
        margin: 0;
        font-size: 1.1rem;
        color: #fff;
    }

    .visor-body {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
    }

    .visor-card {
        background: #0f172a;
        padding: 1rem;
        border-radius: 8px;
        margin-bottom: 0.75rem;
        border-left: 4px solid transparent;
        transition: transform 0.2s;
    }

    .visor-card:hover {
        transform: translateY(-2px);
    }

    .bg-warning h3 {
        color: #fbbf24;
    }

    .bg-success h3 {
        color: #4ade80;
    }

    .bg-danger h3 {
        color: #f87171;
    }

    .card-pending {
        border-left-color: #fbbf24;
    }

    .card-processed {
        border-left-color: #4ade80;
    }

    .card-backlog {
        border-left-color: #f87171;
    }

    .card-title {
        font-weight: 600;
        color: #fff;
        margin-bottom: 0.25rem;
    }

    .card-meta {
        font-size: 0.85rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
    }

    .badge {
        background: rgba(255, 255, 255, 0.1);
        padding: 0.25rem 0.75rem;
        border-radius: 20px;
        font-size: 0.85rem;
    }
</style>

{% endblock %}

{% block scripts %}
<script>
    async def loadDashboard() {
        try {
            const res = await fetch('/api/visor/dashboard-data');
            const data = await res.json();

            updateList('list-pending', data.pending, 'card-pending', 'count-pending');
            updateList('list-processed', data.processed, 'card-processed', 'count-processed');
            updateList('list-backlog', data.backlog, 'card-backlog', 'count-backlog');

        } catch (e) {
            console.error("Error loading dashboard", e);
        }
    }

    function updateList(elementId, items, cardClass, countId) {
        const container = document.getElementById(elementId);
        document.getElementById(countId).textContent = items.length;
        container.innerHTML = items.map(item => `
            <div class="visor-card ${cardClass}">
                <div class="card-title">Ord #${item.order_number || item.id} - ${item.article || item.article_type}</div>
                <div class="card-meta">
                    <span>${item.date || new Date(item.created_at).toLocaleDateString()}</span>
                    <span>${item.batches || item.batch_qty} Batches</span>
                </div>
                <div class="card-meta" style="margin-top: 5px;">
                     <span>${item.presentation}</span>
                     <span>${item.kg || item.kg_produced} Kg</span>
                </div>
            </div>
        `).join('');
    }

    // Initial Load
    loadDashboard();
    // Refresh every 30s
    setInterval(loadDashboard, 30000);
</script>
{% endblock %}
