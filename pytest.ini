[pytest]
# Only collect from the root test files and tests/ folder.
# Ignore recovery_temp, scripts, and non-test text files.
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    recovery_temp
    scripts
    venv
    .git
    __pycache__
    app_backup_*
    node_modules
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
