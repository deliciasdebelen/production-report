version: '3.8'

services:
  consistency-monitor:
    build: .
    container_name: consistency-monitor
    restart: unless-stopped
    ports:
      - "${PORT:-8002}:8002"
    environment:
      - PORT=8002
      - DATABASE_URL=postgresql://app_user:production_password@production-report-db:5432/production_db
      - SQLSRV_HOST=192.168.1.205
      - SQLSRV_DATABASE=carmal_a
      - SQLSRV_USER=PROFIT
      - SQLSRV_PASSWORD=profit
      - TZ=America/Caracas
    networks:
      - app-network

networks:
  app-network:
    name: production-report_app-network
    external: true
